<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Camera Remote">
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<title>Nova Camera Remote</title>
<style>
  :root { --a: #ff7a18; --b: #ffb347; --bg: #0b0c10; --p1: #14161c; --p2: #1c1f27; --p3: #252934; --line: rgba(255,255,255,.09); --txt: #e8eaf0; --dim: #8c92a3; --ok: #22c55e; --err: #ef4444; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 13.5px/1.3 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .off { display: none !important; }
  #app { min-height: 100%; display: grid; gap: 8px; padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); grid-template-columns: minmax(0, 1fr); align-content: start; }
  @media (orientation: landscape) and (min-width: 700px) { #app { grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); align-items: start; } .colL, .colR { max-height: calc(100vh - 16px); overflow-y: auto; }
    .stage { width: min(100%, calc(52vh * 16 / 9)); align-self: center; flex: 0 0 auto; } .hint { display: none; } .joy { width: 120px; height: 120px; } .rock { height: 120px; } }
  .colL, .colR { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  header { display: flex; align-items: center; gap: 8px; } header img { width: 28px; height: 28px; border-radius: 8px; } header b { font-size: 14px; } header small { color: var(--dim); font-size: 11px; display: block; } .grow { flex: 1; }
  .pill { padding: 4px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; background: var(--p2); color: var(--dim); white-space: nowrap; }
  .pill.air { background: var(--err); color: #fff; } .pill.pvw { background: var(--ok); color: #04140a; } .pill.on { background: rgba(34,197,94,.18); color: var(--ok); }
  .cams { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; } .cams::-webkit-scrollbar { display: none; }
  .cam { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 11px; border-radius: 9px; background: var(--p2); border: 2px solid transparent; font-weight: 700; font-size: 12.5px; max-width: 170px; }
  .cam span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .cam i { width: 8px; height: 8px; border-radius: 50%; background: #4b5060; flex: 0 0 auto; }
  .cam.sel { border-color: var(--a); background: rgba(255,122,24,.13); } .cam.program i { background: var(--err); box-shadow: 0 0 7px var(--err); } .cam.preview i { background: var(--ok); } .cam.gone { opacity: .45; }
  .stage { position: relative; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); touch-action: none; }
  .stage.air { border-color: var(--err); } .stage canvas { width: 100%; height: 100%; display: block; }
  .stage .grid3 { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.16) 33.33%, transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.16) 66.66%, transparent calc(66.66% + .5px)), linear-gradient(180deg, transparent calc(33.33% - .5px), rgba(255,255,255,.16) 33.33%, transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.16) 66.66%, transparent calc(66.66% + .5px)); }
  .stage .tag { position: absolute; left: 8px; top: 7px; font-size: 10px; font-weight: 900; letter-spacing: .08em; padding: 3px 7px; border-radius: 5px; background: rgba(0,0,0,.55); }
  .stage.air .tag { background: var(--err); }
  .stage .zm { position: absolute; left: 8px; bottom: 7px; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px; background: rgba(0,0,0,.55); }
  .stage .pgm { position: absolute; right: 7px; top: 7px; width: 26%; aspect-ratio: 16/9; border-radius: 6px; border: 2px solid var(--err); overflow: hidden; background: #000; }
  .stage .pgm img { width: 100%; height: 100%; display: block; object-fit: cover; } .stage .pgm b { position: absolute; left: 3px; top: 2px; font-size: 8px; letter-spacing: .08em; background: var(--err); padding: 1px 3px; border-radius: 3px; }
  .ring { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 2px solid var(--a); pointer-events: none; animation: ring .6s ease-out forwards; }
  .ring.focus { border-color: #fde047; border-radius: 6px; }
  @keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  .hint { color: var(--dim); font-size: 11px; text-align: center; margin-top: -2px; }
  .pad2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--p1); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .joy { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, var(--p3), var(--p2)); border: 1px solid var(--line); touch-action: none; justify-self: center; }
  .joy::before, .joy::after { content: ''; position: absolute; background: rgba(255,255,255,.06); } .joy::before { left: 50%; top: 14px; bottom: 14px; width: 1px; } .joy::after { top: 50%; left: 14px; right: 14px; height: 1px; }
  .knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: linear-gradient(135deg, var(--a), var(--b)); box-shadow: 0 6px 18px rgba(255,122,24,.35); transition: transform .18s cubic-bezier(.2,.9,.3,1.2); z-index: 1; }
  .joy.on .knob { transition: none; }
  .rock { width: 66px; height: 150px; border-radius: 33px; background: var(--p2); border: 1px solid var(--line); position: relative; touch-action: none; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 10px 0; font-weight: 900; color: var(--dim); }
  .rock .rk { position: absolute; left: 6px; right: 6px; top: 50%; height: 44px; margin-top: -22px; border-radius: 22px; background: var(--p3); border: 1px solid rgba(255,255,255,.12); display: grid; place-items: center; font-size: 10px; letter-spacing: .06em; transition: transform .18s cubic-bezier(.2,.9,.3,1.2); }
  .rock.on .rk { transition: none; background: rgba(255,122,24,.35); color: #fff; }
  .ctrls { display: flex; gap: 6px; } .ctrls button { flex: 1; }
  .btn { background: var(--p2); border-radius: 10px; padding: 11px 8px; font-weight: 800; font-size: 12.5px; text-align: center; }
  .btn.pri { background: linear-gradient(135deg, var(--a), var(--b)); color: #fff; } .btn.on { background: rgba(255,122,24,.2); color: var(--b); box-shadow: inset 0 0 0 2px var(--a); }
  .btn.red { background: var(--err); color: #fff; } .btn:disabled { opacity: .4; }
  .card { background: var(--p1); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .tabs { display: flex; gap: 4px; background: var(--p2); padding: 3px; border-radius: 10px; } .tabs button { flex: 1; background: none; color: var(--dim); font-weight: 800; font-size: 12px; padding: 8px 4px; border-radius: 8px; } .tabs button.on { background: var(--a); color: #fff; }
  .sub { font-size: 10.5px; color: var(--dim); font-weight: 800; letter-spacing: .08em; margin: 10px 0 6px; display: flex; align-items: center; gap: 8px; } .sub:first-child { margin-top: 2px; } .sub span { flex: 1; }
  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .shot { position: relative; aspect-ratio: 16/10; border-radius: 9px; background: var(--p2); border: 2px dashed rgba(255,255,255,.1); overflow: hidden; display: grid; place-items: center; color: var(--dim); font-weight: 800; padding: 0; }
  .shot.has { border-style: solid; border-color: transparent; } .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shot span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10.5px; padding: 3px 5px; background: linear-gradient(transparent, rgba(0,0,0,.8)); color: #fff; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shots.saving .shot { border: 2px solid var(--a); } .shot.hit { box-shadow: 0 0 0 3px var(--a); }
  .seg { display: flex; background: var(--p2); border-radius: 9px; padding: 3px; gap: 2px; } .seg button { flex: 1; background: none; color: var(--dim); font-weight: 800; font-size: 11.5px; padding: 7px 4px; border-radius: 7px; } .seg button.on { background: var(--a); color: #fff; }
  .rng { display: flex; align-items: center; gap: 8px; } .rng input { flex: 1; accent-color: var(--a); height: 28px; } .rng b { min-width: 52px; text-align: right; font-size: 12px; }
  select { width: 100%; background: var(--p2); color: var(--txt); border: 1px solid var(--line); border-radius: 9px; padding: 9px; font: inherit; font-weight: 700; }
  .tog { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--p2); border-radius: 10px; font-weight: 700; margin-top: 6px; } .tog span { flex: 1; } .tog small { display: block; color: var(--dim); font-weight: 500; font-size: 11px; }
  .sw { width: 42px; height: 24px; border-radius: 12px; background: #3a3e4a; position: relative; flex: 0 0 auto; transition: background .15s; } .sw::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .tog.on .sw { background: var(--a); } .tog.on .sw::after { transform: translateX(18px); }
  .take { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .take .btn { padding: 14px; font-size: 14px; letter-spacing: .05em; }
  .bat { font-size: 11px; color: var(--dim); }
  #pin { position: fixed; inset: 0; background: radial-gradient(600px 400px at 50% 20%, rgba(255,122,24,.22), transparent), var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; z-index: 10; text-align: center; }
  #pin img { width: 70px; height: 70px; border-radius: 18px; } #pin h1 { margin: 0; font-size: 21px; } #pin p { margin: 0; color: var(--dim); max-width: 330px; }
  .dots { display: flex; gap: 12px; height: 18px; } .dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--p2); border: 2px solid #3a3e4a; } .dots i.f { background: var(--a); border-color: var(--a); }
  .keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 10px; } .keys button { height: 58px; border-radius: 16px; border: 1px solid var(--line); background: var(--p1); font-size: 22px; font-weight: 700; }
  #err { color: #fca5a5; min-height: 18px; font-weight: 700; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #111; border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  #toast.on { opacity: 1; }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 15; display: flex; align-items: flex-end; justify-content: center; }
  #sheet .box { width: min(460px, 100%); background: var(--p1); border-radius: 16px 16px 0 0; padding: 14px 14px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  #sheet .box b { font-size: 15px; } #sheet input { background: var(--p2); border: 1px solid var(--line); color: var(--txt); border-radius: 9px; padding: 11px; font: inherit; }
</style>
</head>
<body>
<div id="pin">
  <img src="icon.png" alt=""><h1>Camera Remote</h1><p id="pinText">Type the Camera Remote PIN shown in Nova Studio (bottom-right panel → Team).</p>
  <div class="dots" id="dots"></div><div id="err"></div>
  <div class="keys" id="keys"></div>
</div>
<div id="app" class="off">
  <div class="colL">
    <header><img src="icon.png" alt=""><div><b id="pcName">Nova Studio</b><small>Camera Remote</small></div><span class="grow"></span><span class="bat" id="bat"></span><span class="pill" id="pAir">—</span><span class="pill" id="pLink">●</span></header>
    <div class="cams" id="cams"></div>
    <div class="stage" id="stage"><canvas id="cv" width="640" height="360"></canvas><div class="grid3" id="grid3"></div><span class="tag" id="tag">CAMERA</span><span class="zm" id="zm">100%</span><div class="pgm" id="pgmBox"><img id="pgm" alt=""><b>PROGRAM</b></div></div>
    <div class="hint">Tap to aim · double-tap to zoom in there · pinch to zoom · hold to focus</div>
    <div class="pad2">
      <div class="joy" id="joy"><b class="knob" id="knob"></b></div>
      <div class="rock" id="rock"><span>+</span><b class="rk" id="rk">ZOOM</b><span>−</span></div>
    </div>
    <div class="ctrls"><button class="btn" data-op="home">⌂ Home</button><button class="btn" data-op="stop">■ Stop</button><button class="btn" id="bGrid">Grid</button><button class="btn" id="bPgm">Program</button></div>
    <div class="take" id="takeRow"><button class="btn" id="bPvw" data-op="preview">To Preview</button><button class="btn red" id="bTake" data-op="take">TAKE ON AIR</button></div>
  </div>
  <div class="colR">
    <div class="tabs" id="tabs"><button data-t="shots" class="on">Shots</button><button data-t="moves">Moves</button><button data-t="auto">Auto</button><button data-t="phone" id="tPhone">Phone</button></div>
    <div class="card" id="pane"></div>
  </div>
</div>
<div id="sheet" class="off"><div class="box" id="sheetBox"></div></div>
<div id="toast"></div>
<script>
'use strict';
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
const LOCAL = location.pathname === '/director' && !qs.get('p');
if (qs.get('p')) localStorage.setItem('nd.p', qs.get('p')); if (qs.get('s') != null) localStorage.setItem('nd.s', qs.get('s'));
const P = LOCAL ? '' : (qs.get('p') || localStorage.getItem('nd.p') || ''); const SRV = qs.get('s') ?? localStorage.getItem('nd.s') ?? '';
const peerOpts = s => { if (!s) return { debug: 0 }; try { const u = new URL(/^https?:/.test(s) ? s : 'https://' + s); return { debug: 0, host: u.hostname, port: +u.port || (u.protocol === 'https:' ? 443 : 80), path: u.pathname || '/', secure: u.protocol === 'https:' }; } catch { return { debug: 0 }; } };
let pin = '', entry = '', link = null, st = { cams: [] }, tab = localStorage.getItem('nd.tab') || 'shots', retry = 0, saving = false;
const pref = { grid: localStorage.getItem('nd.grid') !== '0', pgm: localStorage.getItem('nd.pgm') !== '0' };
const buzz = (n = 10) => { try { navigator.vibrate && navigator.vibrate(n); } catch {} };
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 1600); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const send = m => { if (link) link.send(m); };
const op = (o, extra) => send({ t: 'cam', op: o, ...(extra || {}) });

// ---------- PIN ----------
function drawPin() { $('#dots').innerHTML = Array.from({ length: Math.max(6, entry.length) }, (_, i) => `<i class="${i < entry.length ? 'f' : ''}"></i>`).join(''); }
$('#keys').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', 'OK'].map(k => `<button data-k="${k}">${k}</button>`).join('');
$('#keys').onclick = e => { const k = e.target.dataset.k; if (!k) return; if (k === '⌫') entry = entry.slice(0, -1); else if (k === 'OK') { if (entry.length >= 4) { pin = entry; connect(); } } else if (entry.length < 12) entry += k; drawPin(); if (entry.length === 6 && k !== 'OK') { pin = entry; connect(); } };
drawPin();

// ---------- link ----------
let wake = null; const keepAwake = async () => { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} };
const cv = $('#cv'), cx = cv.getContext('2d');
function onMsg(m) {
  if (m.t === 'ok') { $('#pin').classList.add('off'); $('#app').classList.remove('off'); retry = 0; $('#pLink').className = 'pill on'; keepAwake(); send({ t: 'state?' }); return; }
  if (m.t === 'denied') { pin = ''; entry = ''; drawPin(); $('#err').textContent = m.reason || 'Wrong PIN'; $('#pin').classList.remove('off'); $('#app').classList.add('off'); return; }
  if (m.t === 'cstate') { st = m; render(); return; }
  if (m.t === 'cframe') { const img = new Image(); img.onload = () => { if (m.id === st.sel) cx.drawImage(img, 0, 0, 640, 360); send({ t: 'cack' }); }; img.onerror = () => send({ t: 'cack' }); img.src = m.d; return; }
  if (m.t === 'cpgm') { if (pref.pgm) $('#pgm').src = m.d; return; }
  if (m.t === 'toast') toast(m.text);
}
function lost(why) { $('#pLink').className = 'pill'; link = null; if (!pin) return; retry++; setTimeout(connect, Math.min(5000, 800 + retry * 600)); if (why) toast(why); }
function connect() {
  if (!pin) { $('#pin').classList.remove('off'); return; }
  $('#err').textContent = '';
  if (LOCAL) {
    const ws = new WebSocket(`wss://${location.host}/ws/remote`); link = { send: m => ws.readyState === 1 && ws.send(JSON.stringify(m)) };
    ws.onopen = () => ws.send(JSON.stringify({ t: 'auth', pin, want: 'cam', name: 'Camera phone' }));
    ws.onmessage = e => { try { onMsg(JSON.parse(e.data)); } catch {} };
    ws.onclose = e => { if (e.code === 4003) { if (pin) { pin = ''; entry = ''; drawPin(); $('#pin').classList.remove('off'); $('#app').classList.add('off'); } return; } if (e.code === 4029) { $('#err').textContent = e.reason; return; } lost(); };
    return;
  }
  const go = () => { const peer = new Peer(peerOpts(SRV)); peer.on('open', () => { const c = peer.connect(P, { reliable: true, serialization: 'json', metadata: { kind: 'remote', want: 'cam', pin } });
      link = { send: m => c.open && c.send(m) }; c.on('data', onMsg); c.on('close', () => { try { peer.destroy(); } catch {} lost(); }); });
    peer.on('error', e => { try { peer.destroy(); } catch {} lost(e.type === 'peer-unavailable' ? 'Nova Studio not found — is it open?' : 'No internet'); }); };
  if (window.Peer) go(); else { const sc = document.createElement('script'); sc.src = 'peerjs.min.js'; sc.onload = go; sc.onerror = () => lost('No internet'); document.head.append(sc); }
}

// ---------- picture: tap to aim, double-tap to zoom in, pinch, hold to focus ----------
const stage = $('#stage');
const rel = (x, y) => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (x - r.left) / r.width)), Math.min(1, Math.max(0, (y - r.top) / r.height))]; };
const ring = (x, y, cls = '') => { const r = stage.getBoundingClientRect(); const d = document.createElement('i'); d.className = 'ring ' + cls; d.style.left = (x - r.left) + 'px'; d.style.top = (y - r.top) + 'px'; stage.append(d); setTimeout(() => d.remove(), 650); };
const touches = new Map(); let pinch = null, tapT = null, lastTap = 0, holdT = null, moved = false, startPt = null;
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId); touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (touches.size === 2) { clearTimeout(holdT); clearTimeout(tapT); const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), sent: 1, at: 0 }; return; }
  moved = false; startPt = [e.clientX, e.clientY];
  holdT = setTimeout(() => { holdT = null; if (moved || pinch) return; const [x, y] = rel(e.clientX, e.clientY); ring(e.clientX, e.clientY, 'focus'); buzz(25); op('focus', { v: 'point', x, y }); startPt = null; }, 550);
});
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return; touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (startPt && Math.hypot(e.clientX - startPt[0], e.clientY - startPt[1]) > 12) moved = true;
  if (pinch && touches.size === 2) {
    const [a, b] = [...touches.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const f = d / pinch.d; const now = performance.now();
    if (now - pinch.at > 110 && Math.abs(f / pinch.sent - 1) > 0.04) { const [x, y] = rel((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); op('pinch', { x, y, factor: f / pinch.sent }); pinch.sent = f; pinch.at = now; }
  }
});
const up = e => {
  if (!touches.has(e.pointerId)) return; touches.delete(e.pointerId);
  if (pinch) { if (!touches.size) pinch = null; startPt = null; return; }
  if (!holdT || moved || !startPt) { clearTimeout(holdT); holdT = null; return; }
  clearTimeout(holdT); holdT = null;
  const cxp = e.clientX, cyp = e.clientY, [x, y] = rel(cxp, cyp), now = performance.now();
  if (now - lastTap < 300) { clearTimeout(tapT); lastTap = 0; ring(cxp, cyp); buzz(15); op('aim', { x, y, zoomBy: 1.5 }); return; }
  lastTap = now; tapT = setTimeout(() => { ring(cxp, cyp); buzz(); op('aim', { x, y }); }, 280);
};
stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);

// ---------- joystick & zoom rocker (keep telling the PC while held; it stops by itself if the link drops) ----------
const curve = v => Math.sign(v) * Math.pow(Math.abs(v), 1.6);
function holdPad(el, onMove, onEnd) {
  let on = false, last = null, t = null;
  const tick = () => { if (on && last) onMove(...last); };
  el.addEventListener('pointerdown', e => { on = true; el.setPointerCapture(e.pointerId); el.classList.add('on'); buzz(8); move(e); clearInterval(t); t = setInterval(tick, 150); });
  const move = e => { if (!on) return; const r = el.getBoundingClientRect(); last = [e, r]; onMove(e, r); };
  el.addEventListener('pointermove', move);
  const end = () => { if (!on) return; on = false; last = null; clearInterval(t); el.classList.remove('on'); onEnd(); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
}
let lastJoy = 0;
holdPad($('#joy'), (e, r) => {
  const R = r.width / 2; let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R; const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
  $('#knob').style.transform = `translate(${dx * R * 0.6}px, ${dy * R * 0.6}px)`;
  const now = performance.now(); if (now - lastJoy < 70) return; lastJoy = now; op('move', { pan: curve(dx), tilt: -curve(dy) });
}, () => { $('#knob').style.transform = ''; op('move', { pan: 0, tilt: 0 }); setTimeout(() => op('move', { pan: 0, tilt: 0 }), 150); });
let lastZ = 0;
holdPad($('#rock'), (e, r) => {
  let v = -((e.clientY - r.top) / r.height * 2 - 1); v = Math.max(-1, Math.min(1, v)); $('#rk').style.transform = `translateY(${-v * r.height * 0.32}px)`;
  const now = performance.now(); if (now - lastZ < 70) return; lastZ = now; op('zoom', { speed: Math.abs(v) < 0.12 ? 0 : curve(v) });
}, () => { $('#rk').style.transform = ''; op('zoom', { speed: 0 }); setTimeout(() => op('zoom', { speed: 0 }), 150); });

// ---------- buttons ----------
document.addEventListener('click', e => {
  const b = e.target.closest('[data-op]'); if (!b || b.disabled) return;
  if (b.dataset.op === 'take' && !confirm('Put this camera on air now?')) return;
  buzz(); op(b.dataset.op, b.dataset.v != null ? { v: b.dataset.v } : null);
});
$('#bGrid').onclick = () => { pref.grid = !pref.grid; localStorage.setItem('nd.grid', pref.grid ? '1' : '0'); render(); };
$('#bPgm').onclick = () => { pref.pgm = !pref.pgm; localStorage.setItem('nd.pgm', pref.pgm ? '1' : '0'); render(); };
$('#cams').onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; buzz(); cx.fillStyle = '#000'; cx.fillRect(0, 0, 640, 360); op('sel', { id: b.dataset.id }); };
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.t; localStorage.setItem('nd.tab', tab); render(); };

// shots: tap = go there · Save then tap = save here · hold = name / clear
let shotHold = null, shotHeld = false;
$('#pane').addEventListener('pointerdown', e => { const s = e.target.closest('.shot'); if (!s) return; shotHeld = false; clearTimeout(shotHold); shotHold = setTimeout(() => { shotHeld = true; buzz(25); shotMenu(+s.dataset.n); }, 550); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('#pane').addEventListener(ev, () => clearTimeout(shotHold)));
$('#pane').addEventListener('click', e => {
  const s = e.target.closest('.shot'); if (s) { if (shotHeld) return; const n = +s.dataset.n; const pr = presetOf(n);
    if (saving || !pr || !pr.has) { op('store', { n }); saving = false; toast(`Shot ${n} saved`); buzz(20); } else { op('recall', { n }); buzz(); }
    s.classList.add('hit'); setTimeout(() => s.classList.remove('hit'), 300); render(); return; }
  if (e.target.closest('#bSave')) { saving = !saving; render(); return; }
  const t = e.target.closest('[data-tog]'); if (t) { buzz(); op(t.dataset.tog, { on: !t.classList.contains('on') }); return; }
  const g = e.target.closest('[data-set]'); if (g) { buzz(); op(g.dataset.set, { v: g.dataset.v }); return; }
});
$('#pane').addEventListener('change', e => { const el = e.target; if (el.dataset.set) op(el.dataset.set, { v: el.type === 'range' ? +el.value : el.value }); });
$('#pane').addEventListener('input', e => { const el = e.target; if (el.type === 'range' && el.nextElementSibling) el.nextElementSibling.textContent = fmt(el.dataset.set, +el.value); });
const presetOf = n => ((st.cam || {}).presets || []).find(q => q.n === n);
function shotMenu(n) {
  const pr = presetOf(n); const box = $('#sheetBox');
  box.innerHTML = `<b>Shot ${n}</b><input id="shName" maxlength="24" placeholder="Name (e.g. Pulpit, Choir, Wide)" value="${esc(pr ? pr.name : '')}">
    <button class="btn pri" id="shSave">Save the current framing here</button><button class="btn" id="shName2">Save the name</button>${pr ? '<button class="btn" id="shClear">Clear this shot</button>' : ''}<button class="btn" id="shCancel">Cancel</button>`;
  $('#sheet').classList.remove('off');
  const close = () => $('#sheet').classList.add('off');
  $('#shSave').onclick = () => { op('store', { n }); const v = $('#shName').value.trim(); if (v) op('rename', { n, name: v }); toast(`Shot ${n} saved`); close(); };
  $('#shName2').onclick = () => { op('rename', { n, name: $('#shName').value.trim() }); close(); };
  if ($('#shClear')) $('#shClear').onclick = () => { op('clear', { n }); close(); };
  $('#shCancel').onclick = close;
}
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#sheet').classList.add('off'); };

const fmt = (k, v) => k === 'ms' ? (v / 1000).toFixed(1) + ' s' : k === 'lens' ? v.toFixed(1) + '×' : k === 'exposure' ? (v > 0 ? '+' : '') + v.toFixed(1) : ['speed', 'handheld'].includes(k) ? (v ? Math.round(v * 100) + '%' : 'Off') : String(v);
const rng = (set, min, max, step, val) => `<div class="rng"><input type="range" data-set="${set}" min="${min}" max="${max}" step="${step}" value="${val}"><b>${fmt(set, +val)}</b></div>`;
const tog = (k, on, label, hint) => `<div class="tog ${on ? 'on' : ''}" data-tog="${k}"><span>${label}${hint ? `<small>${hint}</small>` : ''}</span><i class="sw"></i></div>`;
const seg = (set, cur, list) => `<div class="seg">${list.map(([v, l]) => `<button data-set="${set}" data-v="${v}" class="${cur === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;

// ---------- draw ----------
let paneKey = '';
function render() {
  $('#pcName').textContent = st.name || 'Nova Studio';
  $('#cams').innerHTML = (st.cams || []).map(c => `<button class="cam ${c.id === st.sel ? 'sel' : ''} ${c.tally} ${c.online ? '' : 'gone'}" data-id="${esc(c.id)}"><i></i><span>${esc(c.name)}</span></button>`).join('') || '<span class="pill">No cameras in Nova Studio yet</span>';
  const c = st.cam, me = (st.cams || []).find(x => x.id === st.sel) || {};
  const air = !!(c && c.air), pvw = me.tally === 'preview';
  stage.classList.toggle('air', air); $('#tag').textContent = c ? (air ? '● ON AIR · ' : pvw ? 'PREVIEW · ' : '') + c.name : 'NO CAMERA';
  $('#pAir').className = 'pill' + (air ? ' air' : pvw ? ' pvw' : ''); $('#pAir').textContent = air ? 'ON AIR' : pvw ? 'PREVIEW' : 'OFF AIR';
  $('#zm').textContent = c ? Math.round(c.zoom * 100) + '%' + (c.frozen ? ' · FROZEN' : '') : '';
  $('#grid3').classList.toggle('off', !pref.grid); $('#bGrid').classList.toggle('on', pref.grid);
  $('#pgmBox').classList.toggle('off', !pref.pgm || air); $('#bPgm').classList.toggle('on', pref.pgm);
  const ph = c && c.phone; $('#bat').textContent = ph && ph.battery != null ? `${ph.charging ? '⚡' : '🔋'}${ph.battery}%` : '';
  $('#tPhone').classList.toggle('off', !ph); if (!ph && tab === 'phone') tab = 'shots';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const al = st.allow || {}; $('#takeRow').classList.toggle('off', !al.preview && !al.take);
  $('#bPvw').classList.toggle('off', !al.preview); $('#bTake').classList.toggle('off', !al.take); $('#bTake').disabled = air; $('#bPvw').disabled = air || pvw;
  // the pane is rebuilt only when what it shows changed (so a slider being dragged is never reset)
  const key = JSON.stringify([tab, saving, c && { p: c.presets, d: c.dir, ph: c.phone && { lens: !!c.phone.lens, exp: !!c.phone.exp, t: c.phone.torch, tk: c.phone.torchOk }, s: c.speed, f: c.frozen, hw: c.hw }]);
  if (key === paneKey) return; paneKey = key;
  const pane = $('#pane'); if (!c) { pane.innerHTML = '<p style="color:var(--dim);text-align:center">Choose a camera above.</p>'; return; }
  let h = '';
  if (tab === 'shots') {
    h += `<div class="sub"><span>SHOTS${c.hw ? ' (CAMERA PRESETS)' : ''}</span><button class="btn ${saving ? 'on' : ''}" id="bSave" style="padding:6px 12px">${saving ? 'Tap a box to save' : 'Save'}</button></div><div class="shots ${saving ? 'saving' : ''}">`;
    for (let n = 1; n <= 12; n++) { const pr = presetOf(n); h += `<button class="shot ${pr && pr.has ? 'has' : ''}" data-n="${n}">${pr && pr.thumb ? `<img src="${pr.thumb}" alt="">` : ''}${pr && pr.has ? `<span>${esc(pr.name || 'Shot ' + n)}</span>` : '+'}</button>`; }
    h += `</div><div class="hint" style="margin-top:8px">Tap a shot to glide there · empty box = save here · hold a shot to name or clear it</div>`;
    h += `<div class="sub"><span>SPEED</span></div>${rng('speed', 0.05, 1, 0.05, c.speed)}`;
  } else if (tab === 'moves') {
    h += `<div class="sub"><span>SHOT SIZE</span></div><div class="g4">${[['wide', 'Wide'], ['medium', 'Medium'], ['close', 'Close'], ['xclose', 'Extreme']].map(([v, l]) => `<button class="btn" data-op="size" data-v="${v}">${l}</button>`).join('')}</div>`;
    h += `<div class="sub"><span>FRAMING</span></div><div class="g3"><button class="btn" data-op="third" data-v="left">◧ Left third</button><button class="btn" data-op="third" data-v="centre">▣ Centre</button><button class="btn" data-op="third" data-v="right">◨ Right third</button></div>`;
    h += `<div class="g4" style="margin-top:6px"><button class="btn" data-op="push">Push in</button><button class="btn" data-op="pull">Pull out</button><button class="btn" data-op="nudge" data-v="up">▲ Headroom</button><button class="btn" data-op="nudge" data-v="down">▼ Lower</button></div>`;
    h += `<div class="sub"><span>HOW SHOTS MOVE</span></div>${seg('style', c.dir.style, [['glide', 'Glide'], ['cut', 'Cut'], ['dip', 'Dip'], ['swoop', 'Swoop']])}`;
    h += `<div style="margin-top:8px"><select data-set="ease">${[['smooth', 'Smooth'], ['gentle', 'Gentle'], ['slowDown', 'Slows down at the end'], ['speedUp', 'Speeds up'], ['steady', 'Steady'], ['cinematic', 'Cinematic']].map(([v, l]) => `<option value="${v}" ${c.dir.ease === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
    h += `<div class="sub"><span>TIME FOR A MOVE</span></div>${rng('ms', 300, 15000, 100, c.dir.ms)}`;
  } else if (tab === 'auto') {
    h += tog('tour', c.dir.tour, 'Auto tour', `Moves through your shots by itself every ${c.dir.every} s`);
    h += tog('follow', c.dir.follow, 'Auto follow', 'Keeps a moving speaker in the frame');
    h += tog('drift', c.dir.drift, 'Drift', 'Slowly glides between shot 1 and shot 2');
    h += `<div class="sub"><span>HANDHELD FEEL</span></div>${rng('handheld', 0, 1, 0.05, c.dir.handheld)}`;
    h += `<div class="sub"><span>PICTURE</span></div><div class="g2"><button class="btn ${c.frozen ? 'on' : ''}" data-op="freeze">${c.frozen ? 'Unfreeze' : 'Freeze'}</button><button class="btn" data-op="snapshot">Snapshot</button></div>`;
  } else if (tab === 'phone' && ph) {
    if (!ph.on) h += '<p style="color:#fca5a5;font-weight:700;margin:2px 0 8px">This phone is not connected right now.</p>';
    if (ph.lens) h += `<div class="sub"><span>LENS ZOOM (ON THE PHONE)</span></div>${rng('lens', ph.lens.min, ph.lens.max, 0.1, ph.lens.now)}`;
    else h += '<div class="hint" style="text-align:left">This phone does not allow lens zoom (iPhone) — the zoom rocker zooms in the studio instead.</div>';
    if (ph.exp) h += `<div class="sub"><span>EXPOSURE</span></div>${rng('exposure', ph.exp.min, ph.exp.max, ph.exp.step, ph.exp.now)}`;
    h += `<div class="sub"><span>FOCUS & LIGHT</span></div><div class="g3"><button class="btn" data-op="focus" data-v="auto">Auto focus</button><button class="btn" data-op="focus" data-v="lock">Lock focus</button>${ph.torchOk ? `<button class="btn ${ph.torch ? 'on' : ''}" data-op="torch">Torch</button>` : '<button class="btn" disabled>No torch</button>'}</div>`;
    h += `<div class="g2" style="margin-top:6px"><button class="btn" data-op="flip">Flip lens</button><button class="btn" data-op="focus" data-v="point" >Focus centre</button></div>`;
  }
  pane.innerHTML = h;
}
setInterval(() => send({ t: 'ping' }), 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); if (link) send({ t: 'state?' }); } else { op('move', { pan: 0, tilt: 0 }); op('zoom', { speed: 0 }); } });
</script>
</body>
</html>
